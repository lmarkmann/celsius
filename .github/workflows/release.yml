name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  upload-binaries:
    name: upload ${{ matrix.target }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/upload-rust-binary-action@v1
        id: upload
        with:
          bin: celsius
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          locked: true
          profile: dist
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@v4
        with:
          subject-checksums: ${{ steps.upload.outputs.sha256 }}

  size-badge:
    name: publish the binary size badge
    needs: upload-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: badges
          persist-credentials: true
          path: badges

      - name: measure and publish
        working-directory: badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="celsius-$TAG-x86_64-unknown-linux-musl.tar.gz"
          gh release download "$TAG" --repo lmarkmann/celsius -p "$archive" -D dl
          tar -xzf "dl/$archive" -C dl
          bytes=$(stat -c%s dl/celsius)
          mib=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
          rm -rf dl
          printf '{"schemaVersion":1,"label":"binary","message":"%s MB","color":"blue"}\n' "$mib" > size.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add size.json
          git diff --cached --quiet || git commit -m "celsius $TAG: ${mib} MB"
          git push

  homebrew:
    name: bump homebrew formula
    needs: upload-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: lmarkmann/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true
          path: tap

      - name: render formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          releases="https://github.com/lmarkmann/celsius/releases/download/$TAG"

          macos_arm_archive="celsius-$TAG-aarch64-apple-darwin.tar.gz"
          linux_x86_archive="celsius-$TAG-x86_64-unknown-linux-musl.tar.gz"
          source_url="https://github.com/lmarkmann/celsius/archive/refs/tags/$TAG.tar.gz"

          gh release download "$TAG" --repo lmarkmann/celsius \
            -p "$macos_arm_archive" -p "$linux_x86_archive" -D dist
          curl -sSfL -o "dist/source.tar.gz" "$source_url"

          macos_arm_sha=$(sha256sum "dist/$macos_arm_archive" | cut -d' ' -f1)
          linux_x86_sha=$(sha256sum "dist/$linux_x86_archive" | cut -d' ' -f1)
          source_sha=$(sha256sum dist/source.tar.gz | cut -d' ' -f1)

          cat > tap/Formula/celsius.rb <<EOF
          class Celsius < Formula
            desc "Terminal weather as a first-person sky view"
            homepage "https://github.com/lmarkmann/celsius"
            version "$version"
            license "MIT"

            on_macos do
              on_arm do
                url "$releases/$macos_arm_archive"
                sha256 "$macos_arm_sha"
              end
              on_intel do
                url "$source_url"
                sha256 "$source_sha"
                depends_on "rust" => :build
              end
            end

            on_linux do
              on_intel do
                url "$releases/$linux_x86_archive"
                sha256 "$linux_x86_sha"
              end
              on_arm do
                url "$source_url"
                sha256 "$source_sha"
                depends_on "rust" => :build
              end
            end

            head do
              url "https://github.com/lmarkmann/celsius.git", branch: "main"
              depends_on "rust" => :build
            end

            def install
              if File.exist?("Cargo.toml")
                system "cargo", "install", *std_cargo_args
              else
                bin.install "celsius"
              end
            end

            test do
              assert_match "celsius", shell_output("#{bin}/celsius --version")
            end
          end
          EOF

      - name: commit and push
        working-directory: tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/celsius.rb
          git diff --cached --quiet || git commit -m "celsius $TAG"
          git push
