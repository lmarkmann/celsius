name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (png feature)
        run: cargo clippy --all-targets --features png -- -D warnings

      - name: clippy (celsius-lab)
        run: cargo clippy -p celsius-lab --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: test
        run: cargo nextest run --features png

      - name: test (celsius-lab)
        run: cargo nextest run -p celsius-lab

      - name: bench (compile + smoke)
        run: cargo bench --bench render -- --test

  deny:
    name: cargo deny (advisories + licences + sources + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Policy lives in deny.toml: advisories, the licence allow-list, source
      # registries, and the bans graph. Duplicate versions warn, the rest block.
      - run: cargo deny check

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ref-pin baseline in .github/zizmor.yml; gate on high so tag pins pass.
      - run: pipx run zizmor==1.28.0 --min-severity high .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}
