name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (png feature)
        run: cargo clippy --all-targets --features png -- -D warnings

      - name: clippy (celsius-lab)
        run: cargo clippy -p celsius-lab --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: test
        run: cargo nextest run --features png

      - name: test (celsius-lab)
        run: cargo nextest run -p celsius-lab

      - name: bench (compile + smoke)
        run: cargo bench --bench render -- --test

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # paste (via ratatui) and lru (via ratatui's layout cache); not our code
      - run: cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0002

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ref-pin baseline in .github/zizmor.yml; gate on high so tag pins pass.
      - run: pipx run zizmor==1.26.1 --min-severity high .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}
