name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (png feature)
        run: cargo clippy --all-targets --features png -- -D warnings

      - name: clippy (celsius-lab)
        run: cargo clippy -p celsius-lab --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: test
        run: cargo nextest run --features png

      - name: test (celsius-lab)
        run: cargo nextest run -p celsius-lab

      - name: bench (compile + smoke)
        run: cargo bench --bench render -- --test

  msrv:
    name: msrv (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
      - run: cargo check --locked --features png

  deny:
    name: cargo deny (advisories + licences + sources + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: zizmor@1.28.0
      - run: zizmor --min-severity high .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}
