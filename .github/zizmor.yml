# zizmor baseline for celsius.
# Actions here are pinned to version tags from trusted publishers (actions/,
# taiki-e/, dtolnay/, Swatinem/, release-plz/, mislav/, CodSpeedHQ/). Require at
# least a ref (tag) pin rather than zizmor's default blanket hash-pin. Hash-pinning
# every action plus Dependabot to refresh the SHAs is the stricter follow-up if we
# want it; the artipacked (persist-credentials) findings are likewise deferred
# because they touch the release/release-plz checkouts.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
