[workspace]
changelog_update = true
git_release_enable = true
git_tag_enable = true
pr_labels = ["release"]
pr_name = "chore: release{% if version %} v{{ version }}{% endif %}"
# cargo-semver-checks runs by default (the release-plz action installs it), and an incompatible
# result forces a breaking bump on its own, which on 0.x means 0.x.0. The compatibility line has
# to be spelled out here: this body replaces release-plz's default summary, which is where the
# marker normally lives, so without it the check would run and say nothing.
pr_body = """
{% for release in releases -%}
{% if release.semver_check == "incompatible" %}API breaking changes detected in `{{ release.package }}`.
{% elif release.semver_check == "compatible" %}API compatible changes in `{{ release.package }}`.
{% endif -%}
{% endfor -%}
{% for release in releases -%}
{% if release.breaking_changes %}
```text
{{ release.breaking_changes }}
```
{% endif -%}
{% endfor %}
{% for release in releases %}{% if release.changelog %}{{ release.changelog }}{% endif %}{% endfor -%}
"""

# `release = false` alone is not enough: it suppresses the tag and the GitHub release, while
# `publish` keeps release-plz's own default of true. release-plz refuses to start when that
# disagrees with a workspace member carrying `publish = false` in its Cargo.toml, so the whole
# release step aborts before it reaches celsius. Both keys have to say the same thing.
[[package]]
name = "celsius-lab"
release = false
publish = false

[changelog]
header = """# Changelog

All notable changes to celsius are recorded here. Format roughly follows
Keep a Changelog and versions follow SemVer.
"""
# The breaking block is listed first and separately, and it is not decoration. `commit_parsers`
# below groups on the type alone, so `feat!` lands under Added exactly like `feat` and the release
# notes never say what stopped compiling. 0.5.0 carries a Breaking section only because someone
# wrote it by hand; 0.6.0 was equally breaking and shipped without one. git-conventional sets
# `breaking` for both the `!` marker and a `BREAKING CHANGE:` footer, so this catches either, and
# a commit appears in both places on purpose: Added for what it adds, Breaking for what it costs.
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% set breaking = commits | filter(attribute="breaking", value=true) %}{% if breaking | length > 0 %}
### Breaking
{% for commit in breaking %}
- {{ commit.breaking_description | default(value=commit.message) | upper_first }}{% endfor %}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% endfor %}
{% endfor %}
"""
commit_parsers = [
  { message = "^feat", group = "added" },
  { message = "^fix", group = "fixed" },
  { message = "^perf", group = "performance" },
  { message = "^refactor", group = "changed" },
  { message = "^doc", group = "docs" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "other" },
]
